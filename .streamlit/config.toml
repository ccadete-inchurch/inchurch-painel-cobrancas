# base="dark" NAO E' DECORATIVO — nao tirar sem ler isto.
#
# Ele e' o que garante que o painel abre escuro pra todo mundo, sempre.
#
# Ja tentamos tirar (commit 2b4188c, revertido no mesmo dia): a ideia era
# trocar por [theme.light] + [theme.dark], que deixaria o Streamlit pintar os
# widgets DELE (placeholder, calendario, dropdown, slider, X do dialog) com a
# nossa paleta nos dois modos, em vez de so' no escuro.
#
# O que quebrou: sem `base`, a ordem de resolucao do Streamlit vira
# "escolha gravada no navegador > preferencia do sistema". Quando a gravacao
# nao acontece — e ela depende de um localStorage que o JS pode nao alcancar
# —, ele cai no tema do WINDOWS da pessoa. Numa maquina com Windows claro, o
# painel no modo escuro apareceu com os cards escuros sobre fundo claro.
#
# Ou seja: tirar esta linha nao mexe so' no modo claro, mexe no escuro de
# quem usa Windows claro. Se for tentar de novo, a gravacao tem que ser
# comprovada ANTES de o `base` sair, nao depois.
#
# Enquanto isso o modo claro e' feito por CSS, que nao depende de navegador
# nenhum. Sao dois blocos em config.py, e vale saber a diferenca:
#
#   <<fix-base>>, dentro do CSS global  — vale nos DOIS temas. Placeholder,
#       campo desabilitado e X do dialog, que no escuro tambem estavam ruins.
#   _CSS_CLARO, injetado por css_tema() — vale SO no claro. E a superficie que
#       o Streamlit desenha quando o widget abre: o calendario dentro do
#       popover, a lista do dropdown, o tooltip, a caixa do selectbox.
#
# O que continua fora do alcance do CSS: a marca do dia escolhido no
# calendario. O Streamlit a pinta com !important numa cor derivada do tema
# escuro, e no DOM o unico sinal de "este dia esta selecionado" e o texto do
# aria-label, que muda com o idioma do navegador.

[theme]
base = "dark"
