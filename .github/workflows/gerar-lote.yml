name: Gerar lote diário (08:15 BRT)

on:
  # Disparado pelo n8n via API (POST /actions/workflows/gerar-lote.yml/dispatches)
  # ou manualmente pelo GitHub UI (Actions → Run workflow).
  # Cron schedule do GitHub é best-effort (atrasa horas, drops em alta carga) —
  # n8n é scheduler confiável e dispara essa action via repository_dispatch.
  workflow_dispatch:

# Opt-in pra Node.js 24 (será default a partir de 16/06/2026).
# Remove o warning 'Node.js 20 actions are deprecated'.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  gerar-lote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Gerar lote
        env:
          GCP_SA_JSON:     ${{ secrets.GCP_SA_JSON }}
          PG_N8N_PASSWORD: ${{ secrets.PG_N8N_PASSWORD }}
          # API Superlógica: confere quem já regularizou antes de gerar o lote.
          # Mesmos valores de [superlogica] nos secrets do Streamlit.
          SL_APP_TOKEN:    ${{ secrets.SL_APP_TOKEN }}
          SL_ACCESS_TOKEN: ${{ secrets.SL_ACCESS_TOKEN }}
        run: python scripts/gerar_lote_cron.py

      # A tabela que o disparo consulta (N8N.telefones_para_disparo) e uma
      # projecao do cadastro: WRITE_TRUNCATE, reconstruida inteira. Roda aqui
      # porque o cadastro de clientes aterrissa 8:01 (fluxo n8n das 8h) e esta
      # Action roda 8:15 — provado por time travel, nao por suposicao.
      #
      # continue-on-error e deliberado: o n8n le a conclusao desta Action pra
      # decidir se avisa "o lote FALHOU" no chat. Sem isso, uma falha na
      # publicacao dos telefones daria alarme falso sobre o lote, que estaria
      # perfeito. O preco e a falha ficar silenciosa — da pra ver pela coluna
      # atualizado_em da tabela.
      - name: Publicar telefones pro disparo
        continue-on-error: true
        env:
          GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
        run: python scripts/publicar_telefones.py
