name: Gerar lote diário (08:15 BRT)

on:
  # Disparado pelo n8n via API (POST /actions/workflows/gerar-lote.yml/dispatches)
  # ou manualmente pelo GitHub UI (Actions → Run workflow).
  # Cron schedule do GitHub é best-effort (atrasa horas, drops em alta carga) —
  # n8n é scheduler confiável e dispara essa action via repository_dispatch.
  workflow_dispatch:

jobs:
  gerar-lote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Gerar lote
        env:
          GCP_SA_JSON:     ${{ secrets.GCP_SA_JSON }}
          PG_N8N_PASSWORD: ${{ secrets.PG_N8N_PASSWORD }}
        run: python scripts/gerar_lote_cron.py
